# Dev-profile overrides
# CORS: allow the Vite dev server. Override with CORS_ALLOWED_ORIGINS in Docker.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Demo data seeding — set to false to start the dev stack without sample data.
# Override at runtime: APP_SEED_DEMO_DATA=false docker compose up
app.seed-demo-data=${APP_SEED_DEMO_DATA:true}

# SQL logging — dev only. Never enable these in production (logs bound parameter values).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
