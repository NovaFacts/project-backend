spring.application.name=backend-java

spring.datasource.url=jdbc:postgresql://localhost:5434/novafacts_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8082

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:novafacts-backend}
jwt.audience=${JWT_AUDIENCE:novafacts-api}

# I-1: short-lived cache for UserDetailsServiceImpl.loadUserByUsername(), bounding
# how long a deactivated user's already-issued JWT keeps working after the DB lookup
# it currently forces on every request is replaced with a cache hit.
app.security.user-cache-ttl-seconds=${USER_CACHE_TTL_SECONDS:30}

# Phase 4: IVA rate FacturaService.create() applies to (subtotal - descuentoAnticipo +
# recargoPenalidad) when computing impuestos — the single rate documented project-wide
# (RF_16: "impuestos = base x 0.19"), now policy-driven instead of hardcoded. Override
# via env var if the rate ever changes; no code change required.
app.iva-rate=${IVA_RATE:0.19}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Default admin credentials for AdminUserInitializer (override via env vars in Docker/CI)
admin.init.email=${ADMIN_EMAIL:admin@novafacts.com}
admin.init.password=${ADMIN_PASSWORD:Admin2024!}

# CORS — override with CORS_ALLOWED_ORIGINS env var in staging/production
# Multiple origins: comma-separated (e.g. https://app.novafacts.com,https://admin.novafacts.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator — expose ONLY health over HTTP. Everything else (env, beans, configprops,
# heapdump, threaddump, mappings, metrics, etc.) stays unreachable at the web layer
# regardless of what's on the classpath, since Actuator's web exposure is opt-in per
# endpoint. show-details=never (the Spring Boot default, set explicitly here for
# clarity) means the body is just {"status":"UP"|"DOWN"} — no datasource URL, disk
# paths, or other component detail is ever returned to a caller.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Enables /actuator/health/liveness and /actuator/health/readiness as separate,
# equally detail-free groups — readiness reflects DB connectivity (via Flyway/DataSource
# health indicators), liveness reflects only that the process is running.
management.endpoint.health.probes.enabled=true

# Login rate limiting (brute-force protection for POST /api/auth/login only).
# Per-client-IP token bucket: "capacity" attempts are allowed, refilling by
# "refill-tokens" every "refill-duration-seconds". Defaults below are 5 attempts
# per IP per 60 seconds. Tune per environment; set enabled=false to disable
# entirely (e.g. for a load test against the login endpoint itself).
security.rate-limit.login.enabled=${LOGIN_RATE_LIMIT_ENABLED:true}
security.rate-limit.login.capacity=${LOGIN_RATE_LIMIT_CAPACITY:5}
security.rate-limit.login.refill-tokens=${LOGIN_RATE_LIMIT_REFILL_TOKENS:5}
security.rate-limit.login.refill-duration-seconds=${LOGIN_RATE_LIMIT_REFILL_SECONDS:60}
