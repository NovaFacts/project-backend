spring.application.name=backend-java

spring.datasource.url=jdbc:postgresql://localhost:5434/novafacts_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8082

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:novafacts-backend}
jwt.audience=${JWT_AUDIENCE:novafacts-api}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Default admin credentials for AdminUserInitializer (override via env vars in Docker/CI)
admin.init.email=${ADMIN_EMAIL:admin@novafacts.com}
admin.init.password=${ADMIN_PASSWORD:Admin2024!}

# CORS — override with CORS_ALLOWED_ORIGINS env var in staging/production
# Multiple origins: comma-separated (e.g. https://app.novafacts.com,https://admin.novafacts.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
