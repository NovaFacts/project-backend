# ── Datasource: Testcontainers PostgreSQL ─────────────────────────────────────
# The jdbc:tc: URL instructs ContainerDatabaseDriver to start a real PostgreSQL
# 15 container. The datasource URL, username and password override the
# application.properties placeholders (POSTGRES_USER / POSTGRES_PASSWORD) so
# that those env vars are not required during test execution.
spring.datasource.url=jdbc:tc:postgresql:15:///novafacts_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

# ── JPA: validate entities against the Flyway-managed schema ──────────────────
# Dialect is auto-detected by Hibernate 6 — no explicit setting needed.
# ddl-auto=validate ensures that entity/schema mismatches are caught at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ── Flyway: run all migrations on the TC container ────────────────────────────
# baseline-on-migrate (inherited from application.properties) is a no-op on the
# fresh empty TC container — Flyway runs V1 through V12 unconditionally.
spring.flyway.enabled=true

# ── JWT: test-only fixed values (not real secrets) ────────────────────────────
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1ub3ZhZmFjdHMtaW50ZWdyYXRpb24tdGVzdHMtMjU2LWJpdHM=
jwt.expiration=86400000
