
services:
  # Servicio de la base de datos PostgreSQL
  postgres_db:
    image: postgres:15
    container_name: novafacts_postgres
    restart: always
    environment:
      POSTGRES_DB: novafacts_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de la aplicación Spring Boot
  spring_app:
    build: .
    container_name: novafacts_backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/novafacts_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      # Admin user created by AdminUserInitializer on fresh DB.
      # Override in .env or CI/CD secrets for non-dev environments.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@novafacts.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin2024!}
      # Frontend origin(s) allowed by CORS. Set to the real frontend URL in production.
      # Comma-separated for multiple origins: https://app.example.com,https://admin.example.com
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres_db:
        condition: service_healthy

# Volumen persistente para los datos de PostgreSQL
volumes:
  postgres_data:
